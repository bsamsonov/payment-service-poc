# Reviewers of /pr-review: id, level, on|off. Read by run-reviewers.sh.
#
# Local override (not committed): .review/reviewers.local — lines `<id> on|off` win over this file.
# One run: pr-review.sh --skip=glm,deepseek (switch off), --only=checklist,bugs-opus (run just these).
# A reviewer that is off is recorded as `skipped` (disabled) in quorum.json, report.md and stats.tsv, and the
# quorum does not wait for it: L1 needs an ok reviewer only if some L1 reviewer is on, L2 likewise, and every
# lane switched on by the diff must pass unless that lane is off.
#
# id               level  enabled
checklist          L1     on
bugs-opus          L2     on
deepseek           L2     on
glm                L2     on
code-review        L2     on
# L3 lanes run only when the diff of the round switches them on (lanes.py); `off` keeps them out even then.
lane-db            L3     on
lane-api           L3     on
lane-boundaries    L3     on
lane-guards        L3     on
